name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install core dependencies (fast, always required)
        run: pip install fastapi uvicorn pydantic numpy scikit-learn pytest httpx

      - name: Install optional heavy dependencies (semantic retrieval + LLM layer)
        run: pip install sentence-transformers faiss-cpu anthropic || echo "Optional deps failed to install; TF-IDF fallback retrieval will be used in tests."
        continue-on-error: true

      - name: Lint (syntax-level sanity check)
        run: python -m py_compile $(find app -name "*.py")

      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest tests/ -v

      - name: Validate knowledge base JSON structure
        run: |
          python -c "
          import json
          kb = json.load(open('../data/knowledge_base.json'))
          edges = json.load(open('../data/variable_interactions.json'))
          ids = set()
          for doc in kb['documents']:
              assert doc['id'] not in ids, f'Duplicate KB id {doc[\"id\"]}'
              ids.add(doc['id'])
              for required in ['title', 'source', 'mechanism', 'finding_summary', 'evidence_type', 'confidence']:
                  assert doc.get(required), f'{doc[\"id\"]} missing {required}'
          for edge in edges['edges']:
              for kb_id in edge.get('supporting_kb', []):
                  assert kb_id in ids, f'Edge {edge[\"id\"]} references unknown KB id {kb_id}'
          print(f'Validated {len(ids)} knowledge base entries and {len(edges[\"edges\"])} interaction edges.')
          "
